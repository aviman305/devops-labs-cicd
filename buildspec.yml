version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
  pre_build:
    commands:
      - npm install
  build:
    commands:
      - echo "Build started on `date`"
  post_build:
    commands:
      - echo "Build completed"

artifacts:
  files:
    - app.js
    - package.json
    - package-lock.json
    - appspec.yml
    - public/**/*
    - scripts/**/*
    - .ebextensions/**/*
    - node_modules/**/*
  discard-paths: no
